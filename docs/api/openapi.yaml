openapi: 3.0.3
info:
  title: 'SaaS API Documentation'
  description: 'Multi-tenant SaaS backend: companies, their users and customers, subscription plans with feature limits, and usage analytics.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Auth
    description: "\nRegistration, login, and passwords."
  -
    name: Tenant
    description: "\nYour company."
  -
    name: Users
    description: "\nStaff users of your company."
  -
    name: Customers
    description: "\nYour company customers."
  -
    name: 'Customer Exports'
    description: "\nAsynchronous CSV exports of customers."
  -
    name: Plans
    description: "\nPublic plan list."
  -
    name: Subscription
    description: "\nYour company subscription. There is no payment gateway; renew simulates a successful payment."
  -
    name: Dashboard
    description: "\nUsage and analytics."
  -
    name: Admin
    description: "\nPlatform admin endpoints.\n\nAccess is enforced by the platform.admin middleware on the admin route group."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <code>POST /api/v1/auth/register</code> or <code>POST /api/v1/auth/login</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Register a company'
      operationId: registerACompany
      description: 'Creates the company, its owner, and a subscription in one transaction, then returns a token so the client is logged in at once. A paid plan starts a 14-day trial; free starts active with no period. The owner gets a welcome email.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 1|example-token
                    user:
                      id: 01m3yq2m67tyfq22zt14a0ymyq
                      name: 'Rahim Uddin'
                      email: rahim@rahimtraders.test
                      role: owner
                      is_active: true
                      last_login_at: null
                      created_at: '2026-10-02T16:27:37Z'
                      tenant:
                        id: 01m3yq2kzkqwbq7wbddstwev0v
                        name: 'Rahim Traders'
                        status: active
                        created_at: '2026-10-02T16:27:36Z'
                    tenant:
                      id: 01m3yq2kzkqwbq7wbddstwev0v
                      name: 'Rahim Traders'
                      status: active
                      created_at: '2026-10-02T16:27:36Z'
                    subscription:
                      id: 01m3yq2m6ch3k7tjxzbr2528rx
                      status: trialing
                      plan:
                        id: 01m3ypwrg7s3rw8thb4tw1226n
                        code: starter
                        name: Starter
                        price_cents: 1900
                        currency: USD
                        features:
                          -
                            key: max_users
                            enabled: true
                            limit: 5
                          -
                            key: max_customers
                            enabled: true
                            limit: 500
                          -
                            key: api_rate_per_minute
                            enabled: true
                            limit: 120
                          -
                            key: customer_export
                            enabled: true
                            limit: null
                          -
                            key: analytics_trends
                            enabled: false
                            limit: null
                      trial_ends_at: '2026-10-16T16:27:37Z'
                      current_period_start: null
                      current_period_end: null
                      cancelled_at: null
                      ends_at: null
                      is_usable: true
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|example-token
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01m3yq2m67tyfq22zt14a0ymyq
                          name:
                            type: string
                            example: 'Rahim Uddin'
                          email:
                            type: string
                            example: rahim@rahimtraders.test
                          role:
                            type: string
                            example: owner
                          is_active:
                            type: boolean
                            example: true
                          last_login_at:
                            type: string
                            example: null
                            nullable: true
                          created_at:
                            type: string
                            example: '2026-10-02T16:27:37Z'
                          tenant:
                            type: object
                            properties:
                              id:
                                type: string
                                example: 01m3yq2kzkqwbq7wbddstwev0v
                              name:
                                type: string
                                example: 'Rahim Traders'
                              status:
                                type: string
                                example: active
                              created_at:
                                type: string
                                example: '2026-10-02T16:27:36Z'
                      tenant:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01m3yq2kzkqwbq7wbddstwev0v
                          name:
                            type: string
                            example: 'Rahim Traders'
                          status:
                            type: string
                            example: active
                          created_at:
                            type: string
                            example: '2026-10-02T16:27:36Z'
                      subscription:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01m3yq2m6ch3k7tjxzbr2528rx
                          status:
                            type: string
                            example: trialing
                          plan:
                            type: object
                            properties:
                              id:
                                type: string
                                example: 01m3ypwrg7s3rw8thb4tw1226n
                              code:
                                type: string
                                example: starter
                              name:
                                type: string
                                example: Starter
                              price_cents:
                                type: integer
                                example: 1900
                              currency:
                                type: string
                                example: USD
                              features:
                                type: array
                                example:
                                  -
                                    key: max_users
                                    enabled: true
                                    limit: 5
                                  -
                                    key: max_customers
                                    enabled: true
                                    limit: 500
                                  -
                                    key: api_rate_per_minute
                                    enabled: true
                                    limit: 120
                                  -
                                    key: customer_export
                                    enabled: true
                                    limit: null
                                  -
                                    key: analytics_trends
                                    enabled: false
                                    limit: null
                                items:
                                  type: object
                                  properties:
                                    key:
                                      type: string
                                      example: max_users
                                    enabled:
                                      type: boolean
                                      example: true
                                    limit:
                                      type: integer
                                      example: 5
                          trial_ends_at:
                            type: string
                            example: '2026-10-16T16:27:37Z'
                          current_period_start:
                            type: string
                            example: null
                            nullable: true
                          current_period_end:
                            type: string
                            example: null
                            nullable: true
                          cancelled_at:
                            type: string
                            example: null
                            nullable: true
                          ends_at:
                            type: string
                            example: null
                            nullable: true
                          is_usable:
                            type: boolean
                            example: true
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_FAILED
                    message: 'The given data was invalid.'
                    details:
                      email:
                        - 'The email has already been taken.'
                      plan_code:
                        - 'The selected plan code is invalid.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_FAILED
                      message:
                        type: string
                        example: 'The given data was invalid.'
                      details:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'The email has already been taken.'
                            items:
                              type: string
                          plan_code:
                            type: array
                            example:
                              - 'The selected plan code is invalid.'
                            items:
                              type: string
        429:
          description: 'Rate limit hit (Retry-After header is set)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: RATE_LIMITED
                    message: 'Too many requests. Please slow down.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: RATE_LIMITED
                      message:
                        type: string
                        example: 'Too many requests. Please slow down.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                  description: 'The company (tenant) name. Must not be greater than 255 characters.'
                  example: 'Rahim Traders'
                name:
                  type: string
                  description: 'The owner full name. Must not be greater than 255 characters.'
                  example: 'Rahim Uddin'
                email:
                  type: string
                  description: 'Owner email. Unique across the platform among non-deleted users. Must be a valid email address. Must not be greater than 255 characters.'
                  example: rahim@rahimtraders.test
                password:
                  type: string
                  description: 'At least 8 characters.'
                  example: Secret123
                plan_code:
                  type: string
                  description: 'An active plan code: free, starter, or pro. Defaults to starter. A paid plan starts a 14-day trial. Must match an existing stored value.'
                  example: starter
                  nullable: true
              required:
                - company_name
                - name
                - email
                - password
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Log in'
      operationId: logIn
      description: 'Returns a token named "api" that expires after 7 days. Unknown email, wrong password, and inactive user all return the same 401.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 1|example-token
                    user:
                      id: 01m3ypws7j18e4984mfb5kkz73
                      name: 'Acme Ltd Owner'
                      email: owner@acme.test
                      role: owner
                      is_active: true
                      last_login_at: '2026-10-02T16:27:37Z'
                      created_at: '2026-10-02T16:24:25Z'
                      tenant:
                        id: 01m3ypws0r7ercmyaecr9y5a12
                        name: 'Acme Ltd'
                        status: active
                        created_at: '2026-10-02T16:24:25Z'
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|example-token
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01m3ypws7j18e4984mfb5kkz73
                          name:
                            type: string
                            example: 'Acme Ltd Owner'
                          email:
                            type: string
                            example: owner@acme.test
                          role:
                            type: string
                            example: owner
                          is_active:
                            type: boolean
                            example: true
                          last_login_at:
                            type: string
                            example: '2026-10-02T16:27:37Z'
                          created_at:
                            type: string
                            example: '2026-10-02T16:24:25Z'
                          tenant:
                            type: object
                            properties:
                              id:
                                type: string
                                example: 01m3ypws0r7ercmyaecr9y5a12
                              name:
                                type: string
                                example: 'Acme Ltd'
                              status:
                                type: string
                                example: active
                              created_at:
                                type: string
                                example: '2026-10-02T16:24:25Z'
        401:
          description: 'Wrong email or password, or inactive user'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: INVALID_CREDENTIALS
                    message: 'These credentials do not match our records.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INVALID_CREDENTIALS
                      message:
                        type: string
                        example: 'These credentials do not match our records.'
                      details:
                        type: object
                        properties: {}
        403:
          description: 'Company suspended'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: TENANT_SUSPENDED
                    message: 'Your company account is suspended.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: TENANT_SUSPENDED
                      message:
                        type: string
                        example: 'Your company account is suspended.'
                      details:
                        type: object
                        properties: {}
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_FAILED
                    message: 'The given data was invalid.'
                    details:
                      email:
                        - 'The email field is required.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_FAILED
                      message:
                        type: string
                        example: 'The given data was invalid.'
                      details:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'The email field is required.'
                            items:
                              type: string
        429:
          description: 'Rate limit hit (Retry-After header is set)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: RATE_LIMITED
                    message: 'Too many requests. Please slow down.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: RATE_LIMITED
                      message:
                        type: string
                        example: 'Too many requests. Please slow down.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Account email. Must be a valid email address.'
                  example: owner@acme.test
                password:
                  type: string
                  description: 'Account password.'
                  example: password
              required:
                - email
                - password
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Send a set-password token'
      operationId: sendASetPasswordToken
      description: 'Emails a token for POST /auth/reset-password. Always returns 202, so the API never reveals which emails exist.'
      parameters: []
      responses:
        202:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    message: 'If the email is registered, a reset token has been sent.'
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'If the email is registered, a reset token has been sent.'
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_FAILED
                    message: 'The given data was invalid.'
                    details:
                      email:
                        - 'The email field must be a valid email address.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_FAILED
                      message:
                        type: string
                        example: 'The given data was invalid.'
                      details:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'The email field must be a valid email address.'
                            items:
                              type: string
        429:
          description: 'Rate limit hit (Retry-After header is set)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: RATE_LIMITED
                    message: 'Too many requests. Please slow down.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: RATE_LIMITED
                      message:
                        type: string
                        example: 'Too many requests. Please slow down.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Account email. The response is 202 whether or not it exists. Must be a valid email address.'
                  example: owner@acme.test
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Set a new password'
      operationId: setANewPassword
      description: 'Uses the token from the forgot-password email or from the new-user invitation email.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    message: 'Your password has been set.'
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Your password has been set.'
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_FAILED
                    message: 'The given data was invalid.'
                    details:
                      token:
                        - 'This password reset token is invalid.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_FAILED
                      message:
                        type: string
                        example: 'The given data was invalid.'
                      details:
                        type: object
                        properties:
                          token:
                            type: array
                            example:
                              - 'This password reset token is invalid.'
                            items:
                              type: string
        429:
          description: 'Rate limit hit (Retry-After header is set)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: RATE_LIMITED
                    message: 'Too many requests. Please slow down.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: RATE_LIMITED
                      message:
                        type: string
                        example: 'Too many requests. Please slow down.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Account email. Must be a valid email address.'
                  example: owner@acme.test
                token:
                  type: string
                  description: 'The token from the set-password email.'
                  example: token-from-the-email
                password:
                  type: string
                  description: 'The new password. At least 8 characters.'
                  example: NewSecret123
              required:
                - email
                - token
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Log out'
      operationId: logOut
      description: 'Deletes only the token used for this request. Other devices stay logged in.'
      parameters: []
      responses:
        204:
          description: 'Logged out'
          content:
            application/json:
              schema:
                type: string
                example: ''
        401:
          description: 'Missing, invalid, or expired token'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: UNAUTHENTICATED
                    message: Unauthenticated.
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHENTICATED
                      message:
                        type: string
                        example: Unauthenticated.
                      details:
                        type: object
                        properties: {}
        429:
          description: 'Rate limit hit (Retry-After header is set)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: RATE_LIMITED
                    message: 'Too many requests. Please slow down.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: RATE_LIMITED
                      message:
                        type: string
                        example: 'Too many requests. Please slow down.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Auth
  /api/v1/auth/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: 'Works for tenant users and platform admins. Returns the role, a company summary, and the permission list. A platform admin has no role, company, or permissions.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01m3ypws7j18e4984mfb5kkz73
                    name: 'Acme Ltd Owner'
                    email: owner@acme.test
                    role: owner
                    is_active: true
                    last_login_at: '2026-10-02T16:27:37Z'
                    created_at: '2026-10-02T16:24:25Z'
                    tenant:
                      id: 01m3ypws0r7ercmyaecr9y5a12
                      name: 'Acme Ltd'
                      status: active
                      created_at: '2026-10-02T16:24:25Z'
                    permissions:
                      - tenant.view
                      - tenant.update
                      - users.view
                      - users.create
                      - users.update
                      - users.delete
                      - customers.view
                      - customers.create
                      - customers.update
                      - customers.delete
                      - customers.export
                      - subscription.view
                      - subscription.manage
                      - dashboard.view
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01m3ypws7j18e4984mfb5kkz73
                      name:
                        type: string
                        example: 'Acme Ltd Owner'
                      email:
                        type: string
                        example: owner@acme.test
                      role:
                        type: string
                        example: owner
                      is_active:
                        type: boolean
                        example: true
                      last_login_at:
                        type: string
                        example: '2026-10-02T16:27:37Z'
                      created_at:
                        type: string
                        example: '2026-10-02T16:24:25Z'
                      tenant:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01m3ypws0r7ercmyaecr9y5a12
                          name:
                            type: string
                            example: 'Acme Ltd'
                          status:
                            type: string
                            example: active
                          created_at:
                            type: string
                            example: '2026-10-02T16:24:25Z'
                      permissions:
                        type: array
                        example:
                          - tenant.view
                          - tenant.update
                          - users.view
                          - users.create
                          - users.update
                          - users.delete
                          - customers.view
                          - customers.create
                          - customers.update
                          - customers.delete
                          - customers.export
                          - subscription.view
                          - subscription.manage
                          - dashboard.view
                        items:
                          type: string
        401:
          description: 'Missing, invalid, or expired token'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: UNAUTHENTICATED
                    message: Unauthenticated.
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHENTICATED
                      message:
                        type: string
                        example: Unauthenticated.
                      details:
                        type: object
                        properties: {}
        429:
          description: 'Rate limit hit (Retry-After header is set)'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: RATE_LIMITED
                    message: 'Too many requests. Please slow down.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: RATE_LIMITED
                      message:
                        type: string
                        example: 'Too many requests. Please slow down.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Auth
  /api/v1/tenant:
    get:
      summary: 'Show your company'
      operationId: showYourCompany
      description: 'Needs the tenant.view permission.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01m3ypws0r7ercmyaecr9y5a12
                    name: 'Acme Ltd'
                    status: active
                    created_at: '2026-10-02T16:24:25Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01m3ypws0r7ercmyaecr9y5a12
                      name:
                        type: string
                        example: 'Acme Ltd'
                      status:
                        type: string
                        example: active
                      created_at:
                        type: string
                        example: '2026-10-02T16:24:25Z'
        401:
          description: 'Missing, invalid, or expired token'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: UNAUTHENTICATED
                    message: Unauthenticated.
                    details: {}
